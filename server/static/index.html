<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Velora · Desk</title>
  <style>
    :root {
      --bg: #12141a; --panel: #1a1d26; --line: #2c3140; --fg: #e6e8ef;
      --dim: #8b91a3; --accent: #5ec8a5; --warn: #e0a35a; --danger: #e08080;
      --user: #2a3344; --ai: #1e2836;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr;
      background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans);
    }
    header {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .brand { font: 600 13px var(--mono); color: var(--accent); margin-right: 6px; }
    select, input, button, textarea {
      background: #222733; border: 1px solid var(--line); color: var(--fg);
      border-radius: 6px; padding: 6px 10px; font: 13px var(--sans);
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: #1f3d36; border-color: #2f5a4a; color: var(--accent); }
    button.danger { border-color: #6a4040; color: #f0b0b0; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #meta { color: var(--dim); font: 12px var(--mono); margin-left: auto; }
    .pill {
      display: inline-block; padding: 1px 7px; border-radius: 999px;
      border: 1px solid var(--line); font: 11px var(--mono); color: var(--dim); margin-right: 4px;
    }
    .pill.ok { color: var(--accent); border-color: #2f5a4a; }
    .pill.bad { color: var(--danger); border-color: #5a2f2f; }
    .tabs { display: flex; gap: 4px; }
    .tabs button.on { border-color: var(--accent); color: var(--accent); }
    .warmth-wrap { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
    .warmth-wrap input[type=range] { width: 110px; accent-color: var(--accent); }
    #sessionSelect { max-width: 150px; font: 12px var(--mono); }
    .dbg-only { display: none; }
    body.debug-on .dbg-only { display: inline-flex; align-items: center; gap: 6px; }
    #shell { min-height: 0; display: none; }
    #shell.show { display: grid; }
    #shell.chat { grid-template-columns: 1.35fr 0.75fr; }
    #shell.chat.debug-on { grid-template-columns: 1.2fr 1fr; }
    #shell.chat.debug-on .pane.rem-pane { display: none !important; }
    .bubble.reminder { border: 1px solid #2f5a4a; background: rgba(94,200,165,.1); }
    .tag-rem { font: 600 10px var(--mono); color: var(--accent); margin-right: 6px; }
    #rem-list { list-style: none; margin: 0; padding: 8px 12px; overflow: auto; flex: 1; }
    #rem-list li { display: flex; justify-content: space-between; gap: 8px; padding: 8px; margin: 4px 0; background: #161922; border-radius: 8px; border: 1px solid var(--line); }
    #rem-list .meta { font: 11px var(--mono); color: var(--dim); margin-top: 4px; }
    #shell.memory { grid-template-columns: 1.2fr 1fr; }
    #shell.settings { grid-template-columns: 1fr; }
    @media (max-width: 900px) {
      #shell.chat.debug-on, #shell.memory { grid-template-columns: 1fr; }
    }
    .pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
    .pane:last-child { border-right: none; }
    .pane.debug-pane { display: none; }
    #shell.chat.debug-on .pane.debug-pane { display: flex; }
    .pane-title {
      padding: 8px 12px; font: 12px var(--mono); color: var(--dim);
      border-bottom: 1px solid var(--line); background: #161922;
    }
    #msgs, #logs, #atom-list, #atom-detail, #summaryBox { flex: 1; overflow: auto; padding: 12px; }
    #msgs { display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 92%; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; }
    .bubble.user { align-self: flex-end; background: var(--user); }
    .bubble.ai { align-self: flex-start; background: var(--ai); }
    .bubble .who { font: 11px var(--mono); color: var(--dim); margin-bottom: 4px; }
    .mem-hint {
      display: none; margin: 0 12px; padding: 8px 10px; border-radius: 8px;
      background: rgba(94, 200, 165, 0.12); border: 1px solid #2f5a4a;
      color: var(--accent); font-size: 13px; align-items: center; gap: 8px;
    }
    .mem-hint.show { display: flex; }
    .mem-hint button { margin-left: auto; padding: 2px 8px; font-size: 12px; }
    #composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
    #composer textarea { flex: 1; min-height: 64px; resize: vertical; }
    .log {
      border: 1px solid var(--line); border-radius: 8px; background: #161922;
      overflow: hidden; margin-bottom: 8px;
    }
    .log summary {
      cursor: pointer; padding: 8px 10px; font: 12px var(--mono); color: var(--accent);
      list-style: none;
    }
    .log summary::-webkit-details-marker { display: none; }
    .log pre {
      margin: 0; padding: 0 10px 10px; font: 11.5px/1.45 var(--mono); color: #c8ccd8;
      white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto;
    }
    .hint { color: var(--dim); font-size: 12px; }
    .err { color: var(--danger); padding: 0 12px 8px; font-size: 13px; }
    .item {
      display: block; width: 100%; text-align: left; padding: 8px 10px; margin: 2px 0;
      border: none; border-radius: 6px; background: none; color: var(--fg); cursor: pointer;
    }
    .item:hover, .item.on { background: #222733; }
    .kind { font: 11px var(--mono); color: var(--dim); }
    .stmt { font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .form { padding: 16px 20px; max-width: 560px; display: flex; flex-direction: column; gap: 10px; }
    .form label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 12px; }
    .chip {
      font: 11px var(--mono); padding: 2px 8px; border: 1px solid var(--line);
      border-radius: 999px; color: var(--dim); margin-right: 6px;
    }
    .summary-card {
      background: #161922; border: 1px solid var(--line); border-radius: 10px;
      padding: 14px 16px; margin-bottom: 12px;
    }
    .summary-card h2 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
    .section { margin-top: 12px; }
    .section h3 { margin: 0 0 6px; font-size: 12px; color: var(--dim); font-family: var(--mono); }
    #atom-detail h2 { margin: 0 0 8px; font-size: 18px; }
    #atom-detail pre, .code {
      white-space: pre-wrap; background: #222733; padding: 12px; border-radius: 8px;
      font: 12.5px var(--mono);
    }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
    td, th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
    th { color: var(--dim); font-weight: 500; }
    details.all-atoms { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
    details.all-atoms > summary { cursor: pointer; color: var(--dim); font: 12px var(--mono); }
    label.chk { flex-direction: row !important; align-items: center; gap: 8px; }
  </style>
</head>
<body>
<header>
  <span class="brand">Velora</span>
  <div class="tabs">
    <button class="on" data-tab="chat">对话</button>
    <button data-tab="memory">记忆</button>
    <button data-tab="settings">设置</button>
  </div>
  <select id="sessionSelect" title="会话"></select>
  <button id="btnNew">新会话</button>
  <label class="warmth-wrap" title="风格">
    更助理
    <input type="range" id="warmth" min="0" max="100" value="35" />
    更陪伴
    <span id="warmthVal">35</span>
  </label>
  <label class="warmth-wrap"><input type="checkbox" id="dbgToggle" /> 调试</label>
  <span class="dbg-only">
    <button id="btnCon">手动固化</button>
    <button id="btnProbe">探测状态</button>
    <a id="atomUi" href="http://127.0.0.1:8020/ui" target="_blank" style="color:var(--dim);font-size:12px">atom /ui</a>
  </span>
  <span id="meta">初始化中…</span>
</header>

<section id="shell" class="chat show">
  <div class="pane" data-for="chat">
    <div class="pane-title">对话</div>
    <div id="memHint" class="mem-hint">
      <span id="memHintText"></span>
      <button type="button" id="memHintClose">关闭</button>
    </div>
    <div id="msgs"><div class="hint">同一会话会接上上下文；值得留下的会记入长期记忆。</div></div>
    <div class="err" id="err"></div>
    <div id="composer">
      <textarea id="input" placeholder="说点什么…（Enter 发送；「请记住」开头会立刻固化）"></textarea>
      <button class="primary" id="send">发送</button>
    </div>
  </div>
  <div class="pane rem-pane" data-for="chat">
    <div class="pane-title">提醒</div>
    <div class="form" style="padding:10px 12px;max-width:none">
      <label>事项<input id="remNote" placeholder="明天下午开会" /></label>
      <label>时间（按用户时区）<input id="remDue" type="datetime-local" /></label>
      <button class="primary" id="btnCreateRem">创建提醒</button>
      <div class="hint" id="remTzHint"></div>
    </div>
    <ul id="rem-list"><li class="hint">暂无待办提醒</li></ul>
  </div>
  <div class="pane debug-pane" data-for="chat">
    <div class="pane-title">Debug <button id="btnClearLogs" style="float:right;padding:2px 8px;font-size:11px">清空</button></div>
    <div id="logs"></div>
  </div>

  <div class="pane" data-for="memory" style="display:none">
    <div class="pane-title">我记得什么</div>
    <div class="toolbar">
      <button id="refreshMem">刷新</button>
      <input id="correction" placeholder="纠正：请记住…" style="flex:1;min-width:140px" />
      <button id="saveCorr">写入并固化</button>
      <button id="btnConMem">立即固化</button>
    </div>
    <div id="summaryBox"><div class="hint">加载中…</div></div>
    <details class="all-atoms" style="padding:0 12px 12px">
      <summary>全部条目</summary>
      <div id="atom-list" style="padding:8px 0"></div>
    </details>
  </div>
  <div class="pane" data-for="memory" style="display:none">
    <div class="pane-title">详情</div>
    <div id="atom-detail"><div class="hint">点左侧或摘要中的条目查看详情</div></div>
  </div>

  <div class="pane" data-for="settings" style="display:none">
    <div class="pane-title">设置</div>
    <div class="form">
      <label>LLM Base URL<input id="llm_base_url" /></label>
      <label>Model<input id="llm_model" /></label>
      <label>API Key <span id="keyHint"></span><input id="llm_api_key" type="password" placeholder="留空不改" autocomplete="off" /></label>
      <label>atom-memory Base URL<input id="atom_url" /></label>
      <label>memory space（只读）<input id="space_uid" readonly /></label>
      <label>新会话默认 warmth<input id="default_warmth" type="number" min="0" max="100" /></label>
      <label class="chk"><input type="checkbox" id="show_memory_hints" /> 对话中显示记忆提示</label>
      <label>时区（IANA）<input id="user_timezone" /><span class="hint" id="tzSuggest"></span></label>
      <label class="chk"><input type="checkbox" id="quiet_hours_enabled" /> 启用静默时段</label>
      <label>静默开始 HH:MM<input id="quiet_hours_start" placeholder="22:00" /></label>
      <label>静默结束 HH:MM<input id="quiet_hours_end" placeholder="08:00" /></label>
      <label>预设 / sidecar（只读）<input id="preset_info" readonly /></label>
      <label>Skills（只读）<input id="skills_info" readonly /></label>
      <label class="chk"><input type="checkbox" id="computer_enabled" /> 本机工具（Shell/Python/文件）</label>
      <label class="chk"><input type="checkbox" id="web_search_enabled" /> 网页搜索（Tavily）</label>
      <label>Tavily API Key <span id="tavilyHint"></span><input id="tavily_api_key" type="password" placeholder="留空不改" autocomplete="off" /></label>
      <label>MCP 状态（只读）<input id="mcp_info" readonly /></label>
      <label>MCP 配置 JSON（mcpServers）
        <textarea id="mcp_json" style="min-height:140px;width:100%;font:12px var(--mono)"></textarea>
      </label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="primary" id="saveSettings" type="button">保存设置</button>
        <button id="saveMcp" type="button">保存 MCP 并重载</button>
        <button id="reloadMcp" type="button">仅重载 MCP</button>
      </div>
      <div class="dbg-only" style="flex-direction:column;align-items:stretch;gap:8px">
        <a id="atomChat" href="http://127.0.0.1:8020/chat" target="_blank" style="color:var(--dim);font-size:12px">打开 atom-memory /chat</a>
        <div id="statusBox" class="hint"></div>
      </div>
    </div>
  </div>
</section>

<script>
const $ = (s) => document.querySelector(s);
let sessionId = null;
let sessionsCache = [];
let atoms = [];
let tab = "chat";
let warmthSaveTimer = null;
let showMemoryHints = true;
let userTimezone = "Asia/Shanghai";
let personaOpener = "";
let lastTurnCount = 0;
let turnsPollTimer = null;
let debugOn = localStorage.getItem("velora_debug") === "1";

function browserTimezone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; }
  catch { return "UTC"; }
}

function zonedLocalToUtcIso(dateTimeLocal, timeZone) {
  const [datePart, timePart] = dateTimeLocal.split("T");
  const [y, mo, d] = datePart.split("-").map(Number);
  const [hh, mm] = timePart.split(":").map(Number);
  let guess = Date.UTC(y, mo - 1, d, hh, mm, 0);
  for (let i = 0; i < 4; i++) {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23",
    }).formatToParts(new Date(guess));
    const get = (t) => Number(parts.find((p) => p.type === t)?.value);
    const asUtc = Date.UTC(get("year"), get("month") - 1, get("day"), get("hour"), get("minute"));
    guess += Date.UTC(y, mo - 1, d, hh, mm) - asUtc;
  }
  return new Date(guess).toISOString();
}

function formatInTz(iso, timeZone) {
  try {
    return new Date(iso).toLocaleString("zh-CN", {
      timeZone, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false,
    });
  } catch { return iso; }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );
}

function setMeta(html) { $("#meta").innerHTML = html; }

function applyDebugMode() {
  document.body.classList.toggle("debug-on", debugOn);
  $("#shell").classList.toggle("debug-on", debugOn && tab === "chat");
  $("#dbgToggle").checked = debugOn;
  localStorage.setItem("velora_debug", debugOn ? "1" : "0");
}

function setMemHint(text) {
  if (!showMemoryHints || !text) return;
  $("#memHintText").textContent = text;
  $("#memHint").classList.add("show");
}

function clearMemHint() {
  $("#memHint").classList.remove("show");
  $("#memHintText").textContent = "";
}

function addLog(title, payload, open = false) {
  const d = document.createElement("details");
  d.className = "log";
  if (open) d.open = true;
  const t = new Date().toLocaleTimeString();
  d.innerHTML = `<summary>[${t}] ${esc(title)}</summary><pre>${esc(
    typeof payload === "string" ? payload : JSON.stringify(payload, null, 2)
  )}</pre>`;
  $("#logs").prepend(d);
}

function addBubble(role, text, source) {
  const d = document.createElement("div");
  const isRem = source === "reminder" || String(text || "").startsWith("【提醒】");
  d.className = "bubble " + (role === "user" ? "user" : "ai") + (isRem ? " reminder" : "");
  const who = isRem ? '<span class="tag-rem">提醒</span>' + esc(role) : esc(role);
  d.innerHTML = `<div class="who">${who}</div><div class="body"></div>`;
  d.querySelector(".body").textContent = text;
  $("#msgs").appendChild(d);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
  return d.querySelector(".body");
}

async function loadReminders() {
  if (!sessionId) return;
  const list = await api("/api/reminders?session_id=" + encodeURIComponent(sessionId) + "&status=pending");
  const ul = $("#rem-list");
  $("#remTzHint").textContent = "时区：" + userTimezone + "（静默时段内会延后投递）";
  if (!list.length) {
    ul.innerHTML = '<li class="hint">暂无待办提醒</li>';
    return;
  }
  ul.innerHTML = list.map((r) => `
    <li>
      <div><strong>${esc(r.note)}</strong><div class="meta">${esc(formatInTz(r.due_at, userTimezone))}</div></div>
      <button data-cancel="${esc(r.id)}">取消</button>
    </li>`).join("");
  ul.onclick = (e) => {
    const btn = e.target.closest("[data-cancel]");
    if (!btn) return;
    api("/api/reminders/" + btn.dataset.cancel + "/cancel", { method: "POST" })
      .then(loadReminders).catch((err) => { $("#err").textContent = String(err); });
  };
}

function startTurnsPoll() {
  if (turnsPollTimer) clearInterval(turnsPollTimer);
  turnsPollTimer = setInterval(async () => {
    if (tab !== "chat" || !sessionId) return;
    try {
      const turns = await api("/api/sessions/" + sessionId + "/turns");
      if (turns.length <= lastTurnCount) return;
      lastTurnCount = turns.length;
      $("#msgs").innerHTML = "";
      turns.forEach((t) => addBubble(t.role, t.content, t.source));
      await loadReminders();
    } catch {}
  }, 15000);
}

function showTab(name) {
  tab = name;
  document.querySelectorAll(".tabs button").forEach((b) =>
    b.classList.toggle("on", b.dataset.tab === name)
  );
  const shell = $("#shell");
  shell.className = name + " show";
  shell.classList.toggle("debug-on", debugOn && name === "chat");
  shell.querySelectorAll(".pane").forEach((p) => {
    const forTab = p.dataset.for === name;
    if (p.classList.contains("debug-pane")) {
      p.style.display = forTab && debugOn ? "flex" : "none";
    } else {
      p.style.display = forTab ? "flex" : "none";
    }
  });
  if (name === "memory") loadMemory();
  if (name === "settings") { loadSettings(); probe(); }
  if (name === "chat") { loadReminders().catch(() => {}); startTurnsPoll(); }
}

document.querySelectorAll(".tabs button").forEach((btn) => {
  btn.onclick = () => showTab(btn.dataset.tab);
});

$("#dbgToggle").onchange = () => {
  debugOn = $("#dbgToggle").checked;
  applyDebugMode();
  if (tab === "chat") showTab("chat");
};

$("#memHintClose").onclick = clearMemHint;

async function api(path, opts = {}) {
  const r = await fetch(path, {
    headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
    ...opts,
  });
  if (!r.ok) throw new Error(await r.text() || r.statusText);
  if (r.status === 204) return null;
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? r.json() : r.text();
}

function renderSessionSelect() {
  const sel = $("#sessionSelect");
  sel.innerHTML = sessionsCache.map((s) =>
    `<option value="${esc(s.id)}" ${s.id === sessionId ? "selected" : ""}>${esc(s.id.slice(0, 8))} · w${s.warmth ?? 35}</option>`
  ).join("");
}

async function loadSession(id) {
  sessionId = id;
  clearMemHint();
  const s = sessionsCache.find((x) => x.id === id);
  const w = s?.warmth ?? 35;
  $("#warmth").value = w;
  $("#warmthVal").textContent = w;
  const turns = await api("/api/sessions/" + sessionId + "/turns");
  lastTurnCount = turns.length;
  $("#msgs").innerHTML = "";
  if (!turns.length) {
    if (personaOpener) {
      addBubble("assistant", personaOpener, "opener");
    } else {
      $("#msgs").innerHTML = '<div class="hint">同一会话会接上上下文；值得留下的会记入长期记忆。</div>';
    }
  } else {
    turns.forEach((t) => addBubble(t.role, t.content, t.source));
  }
  renderSessionSelect();
  await loadReminders();
  startTurnsPoll();
}

async function refreshSessions(preferId) {
  sessionsCache = await api("/api/sessions");
  let s = preferId ? sessionsCache.find((x) => x.id === preferId) : sessionsCache[0];
  if (!s) {
    s = await api("/api/sessions", { method: "POST", body: "{}" });
    sessionsCache = [s, ...sessionsCache];
  }
  await loadSession(s.id);
}

async function init() {
  applyDebugMode();
  try {
    const s = await api("/api/settings");
    showMemoryHints = !!s.show_memory_hints;
    userTimezone = s.user_timezone || browserTimezone();
    personaOpener = s.persona_opener || "";
  } catch {}
  await refreshSessions();
  await probe();
  startTurnsPoll();
}

$("#btnCreateRem").onclick = async () => {
  const note = $("#remNote").value.trim();
  const local = $("#remDue").value;
  if (!note || !local || !sessionId) return;
  try {
    await api("/api/reminders", {
      method: "POST",
      body: JSON.stringify({
        session_id: sessionId,
        note,
        due_at: zonedLocalToUtcIso(local, userTimezone),
      }),
    });
    $("#remNote").value = "";
    $("#remDue").value = "";
    await loadReminders();
  } catch (e) {
    $("#err").textContent = String(e);
  }
};

$("#sessionSelect").onchange = () => loadSession($("#sessionSelect").value).catch((e) => {
  $("#err").textContent = String(e);
});

$("#warmth").oninput = () => {
  $("#warmthVal").textContent = $("#warmth").value;
  clearTimeout(warmthSaveTimer);
  warmthSaveTimer = setTimeout(async () => {
    if (!sessionId) return;
    const s = await api("/api/sessions/" + sessionId, {
      method: "PATCH",
      body: JSON.stringify({ warmth: Number($("#warmth").value) }),
    });
    const i = sessionsCache.findIndex((x) => x.id === s.id);
    if (i >= 0) sessionsCache[i] = s; else sessionsCache.unshift(s);
    renderSessionSelect();
  }, 300);
};

async function probe() {
  try {
    const st = await api("/api/debug/status");
    const llm = st.llm || {};
    const mem = st.memory || {};
    setMeta(
      `<span class="pill ${llm.ok ? "ok" : "bad"}">llm ${llm.ok ? "ok" : "fail"}</span>` +
      `<span class="pill ${mem.ok ? "ok" : "bad"}">memory ${mem.ok ? "ok" : "fail"}</span>`
    );
    const box = $("#statusBox");
    if (box) {
      box.innerHTML =
        `<div>LLM: ${llm.ok ? "可达" : "不可达"} · <code>${esc(llm.model)}</code></div>` +
        `<div>Memory: ${mem.ok ? "可达" : "不可达"} · <code>${esc(mem.base_url)}</code></div>`;
    }
    if (mem.base_url) {
      $("#atomUi").href = mem.base_url.replace(/\/$/, "") + "/ui?uid=" + encodeURIComponent(mem.space_uid || "");
      $("#atomChat").href = mem.base_url.replace(/\/$/, "") + "/chat";
    }
    return st;
  } catch (e) {
    setMeta(`<span class="pill bad">status fail</span>`);
  }
}

async function streamChat(text) {
  addBubble("user", text);
  const asst = addBubble("assistant", "");
  $("#err").textContent = "";
  clearMemHint();
  addLog("user_message", { text }, false);
  const hints = [];
  const res = await fetch("/api/chat/stream", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, text }),
  });
  if (!res.ok) {
    const msg = await res.text();
    $("#err").textContent = msg;
    addLog("http_error", msg, true);
    return;
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", event = "message", acc = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop() || "";
    for (const line of lines) {
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) {
        let data = line.slice(5).trim();
        try { data = JSON.parse(data); } catch {}
        if (event === "token" && data && data.text) {
          acc += data.text;
          asst.textContent = acc;
          $("#msgs").scrollTop = $("#msgs").scrollHeight;
        } else if (event !== "token") {
          addLog(event, data, event === "error");
          if (event === "memory_recall" && data && data.has_block) {
            hints.push("本轮用到了长期记忆");
          }
          if (event === "persisted" && data && data.memory_wrote) {
            hints.push(data.consolidated ? "本轮已写入记忆并固化" : "本轮已写入记忆");
          }
          if (event === "reminder_created") loadReminders().catch(() => {});
          if (event === "tool_call" && data && data.name) {
            hints.push("调用工具 " + data.name);
          }
          if (event === "tool_result" && data && (data.name === "create_reminder" || data.name === "list_reminders")) {
            loadReminders().catch(() => {});
          }
        }
        if (event === "error" && data && data.message) $("#err").textContent = data.message;
        event = "message";
      }
    }
  }
  if (hints.length) setMemHint([...new Set(hints)].join(" · "));
  try {
    const turns = await api("/api/sessions/" + sessionId + "/turns");
    lastTurnCount = turns.length;
  } catch {}
}

$("#send").onclick = async () => {
  const ta = $("#input");
  const text = ta.value.trim();
  if (!text || !sessionId) return;
  ta.value = "";
  try { await streamChat(text); } catch (e) { $("#err").textContent = String(e); }
};

$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("#send").click();
  }
});

$("#btnNew").onclick = async () => {
  const s = await api("/api/sessions", {
    method: "POST",
    body: JSON.stringify({ warmth: Number($("#warmth").value) }),
  });
  sessionsCache = [s, ...sessionsCache.filter((x) => x.id !== s.id)];
  await loadSession(s.id);
  addLog("new_session", s, false);
  await probe();
};

async function consolidate() {
  const r = await api("/api/memory/consolidate", { method: "POST" });
  addLog("consolidate", r, false);
  if (tab === "memory") await loadMemory();
  return r;
}

$("#btnCon").onclick = () => consolidate().catch((e) => addLog("consolidate_error", String(e), true));
$("#btnConMem").onclick = () => consolidate().catch((e) => alert(e.message));
$("#btnProbe").onclick = () => probe();
$("#btnClearLogs").onclick = () => { $("#logs").innerHTML = ""; };

async function loadMemory() {
  const summary = await api("/api/memory/summary");
  const box = $("#summaryBox");
  if (!summary.total) {
    box.innerHTML = `<div class="summary-card"><h2>${esc(summary.headline)}</h2></div>`;
  } else {
    box.innerHTML = `
      <div class="summary-card">
        <h2>${esc(summary.headline)}</h2>
        ${(summary.sections || []).map((sec) => `
          <div class="section">
            <h3>${esc(sec.label)}
              <button class="danger" data-archive-kind="${esc(sec.kind)}" style="margin-left:8px;padding:2px 8px;font-size:11px">归档此类</button>
            </h3>
            ${(sec.items || []).map((it) => `
              <button class="item" data-key="${esc(it.key)}">
                <div class="stmt">${esc(it.statement)}</div>
              </button>`).join("")}
          </div>`).join("")}
      </div>`;
  }
  box.onclick = (e) => {
    const arch = e.target.closest("[data-archive-kind]");
    if (arch) {
      const kind = arch.dataset.archiveKind;
      if (!confirm(`确认归档「${kind}」下的记忆？`)) return;
      api("/api/memory/atoms/archive-kind", {
        method: "POST",
        body: JSON.stringify({ kind }),
      }).then(loadMemory).catch((err) => alert(err.message));
      return;
    }
    const btn = e.target.closest("[data-key]");
    if (btn) openAtom(btn.dataset.key);
  };

  const data = await api("/api/memory/atoms?page=1&page_size=100");
  atoms = data.results || [];
  const by = {};
  for (const a of atoms) (by[a.kind] ||= []).push(a);
  const list = $("#atom-list");
  list.innerHTML =
    Object.keys(by).sort().map((k) => `
      <div class="kind" style="margin:10px 0 4px">${esc(k)} (${by[k].length})</div>
      ${by[k].map((a) => `
        <button class="item" data-key="${esc(a.key)}">
          <div class="stmt">${esc(a.statement || "")}</div>
          <div class="kind">${esc(a.key)}</div>
        </button>`).join("")}
    `).join("") || '<div class="hint">还没有记住什么。可以说「请记住…」。</div>';
  list.onclick = (e) => {
    const btn = e.target.closest("[data-key]");
    if (btn) openAtom(btn.dataset.key);
  };
}

async function openAtom(key) {
  [...document.querySelectorAll(".item")].forEach((el) =>
    el.classList.toggle("on", el.dataset.key === key)
  );
  const a = await api("/api/memory/atoms/" + encodeURIComponent(key));
  const revs = a.revisions || [];
  const ev = a.evidence || [];
  $("#atom-detail").innerHTML = `
    <h2>${esc(a.statement)}</h2>
    <div style="margin-bottom:12px">
      <span class="chip">${esc(a.kind)}</span>
      <span class="chip">${esc(a.key)}</span>
      <span class="chip">${esc(a.status)}</span>
      <button class="danger" id="btnArchive">归档</button>
    </div>
    <div class="kind">detail</div>
    <pre>${esc(a.detail || "（空）")}</pre>
    <div class="kind" style="margin-top:16px">revisions</div>
    <table><tr><th>seq</th><th>reason</th><th>trigger</th><th>statement</th></tr>
      ${revs.map((r) => `<tr><td>${r.seq}</td><td>${esc(r.change_reason)}</td>
        <td>${esc(r.trigger)}</td><td>${esc(r.statement)}</td></tr>`).join("") ||
        "<tr><td colspan=4>（无）</td></tr>"}
    </table>
    <div class="kind" style="margin-top:16px">evidence</div>
    <table><tr><th>rev</th><th>source</th><th>kind</th><th>at</th></tr>
      ${ev.map((e) => `<tr><td>${e.revision_seq}</td><td>${e.source_id}</td>
        <td>${esc(e.source_kind)}</td><td>${esc(e.source_occurred_at)}</td></tr>`).join("") ||
        "<tr><td colspan=4>（无）</td></tr>"}
    </table>`;
  $("#btnArchive").onclick = async () => {
    await api("/api/memory/atoms/" + encodeURIComponent(key) + "/archive", { method: "POST" });
    $("#atom-detail").innerHTML = '<div class="hint">已归档</div>';
    loadMemory();
  };
}

$("#refreshMem").onclick = () => loadMemory().catch((e) => alert(e.message));
$("#saveCorr").onclick = async () => {
  const text = $("#correction").value.trim();
  if (!text) return;
  await api("/api/memory/corrections", { method: "POST", body: JSON.stringify({ text }) });
  $("#correction").value = "";
  loadMemory();
};

async function loadSettings() {
  const s = await api("/api/settings");
  $("#llm_base_url").value = s.llm_base_url;
  $("#llm_model").value = s.llm_model;
  $("#atom_url").value = s.atom_memory_base_url;
  $("#space_uid").value = s.memory_space_uid;
  $("#default_warmth").value = s.default_warmth ?? 35;
  $("#show_memory_hints").checked = !!s.show_memory_hints;
  showMemoryHints = !!s.show_memory_hints;
  userTimezone = s.user_timezone || browserTimezone();
  $("#user_timezone").value = userTimezone;
  $("#quiet_hours_enabled").checked = !!s.quiet_hours_enabled;
  $("#quiet_hours_start").value = s.quiet_hours_start || "22:00";
  $("#quiet_hours_end").value = s.quiet_hours_end || "08:00";
  $("#computer_enabled").checked = s.computer_enabled !== false;
  $("#web_search_enabled").checked = s.web_search_enabled !== false;
  $("#tavilyHint").textContent = s.tavily_api_key_set ? "（已配置，留空不改）" : "";
  const sug = browserTimezone();
  $("#tzSuggest").textContent = sug && sug !== userTimezone ? `（浏览器建议 ${sug}，可手动改）` : "";
  $("#preset_info").value = `${s.preset_id || "—"} · sidecar=${s.start_memory_sidecar ? "on" : "off"} · reminders=${s.reminders_enabled ? "on" : "off"}`;
  $("#keyHint").textContent = s.llm_api_key_set ? "（已配置，留空不改）" : "";
  try {
    const sk = await api("/api/skills");
    $("#skills_info").value = `${sk.count || 0} · ${sk.skills_dir || ""}`;
  } catch {
    $("#skills_info").value = "不可用";
  }
  try {
    const m = await api("/api/mcp/status");
    const okN = (m.servers || []).filter((x) => x.ok).length;
    $("#mcp_info").value = `${m.enabled ? "on" : "off"} · 服 ${okN}/${(m.servers || []).length} · 工具 ${m.tool_count || 0} · ${m.config_path || ""}`;
  } catch {
    $("#mcp_info").value = "不可用";
  }
  try {
    const cfg = await api("/api/mcp/servers");
    $("#mcp_json").value = JSON.stringify(cfg.mcpServers || {}, null, 2);
  } catch {
    $("#mcp_json").value = "{}";
  }
}

$("#saveSettings").onclick = async () => {
  const body = {
    llm_base_url: $("#llm_base_url").value,
    llm_model: $("#llm_model").value,
    atom_memory_base_url: $("#atom_url").value,
    default_warmth: Number($("#default_warmth").value),
    show_memory_hints: $("#show_memory_hints").checked,
    user_timezone: $("#user_timezone").value.trim() || userTimezone,
    quiet_hours_enabled: $("#quiet_hours_enabled").checked,
    quiet_hours_start: $("#quiet_hours_start").value.trim() || "22:00",
    quiet_hours_end: $("#quiet_hours_end").value.trim() || "08:00",
    computer_enabled: $("#computer_enabled").checked,
    web_search_enabled: $("#web_search_enabled").checked,
  };
  const key = $("#llm_api_key").value;
  if (key) body.llm_api_key = key;
  const tavily = $("#tavily_api_key").value;
  if (tavily) body.tavily_api_key = tavily;
  const s = await api("/api/settings", { method: "PUT", body: JSON.stringify(body) });
  showMemoryHints = !!s.show_memory_hints;
  userTimezone = s.user_timezone || userTimezone;
  $("#llm_api_key").value = "";
  $("#tavily_api_key").value = "";
  await loadSettings();
  await probe();
  await loadReminders();
};

$("#saveMcp").onclick = async () => {
  let mcpServers;
  try {
    mcpServers = JSON.parse($("#mcp_json").value || "{}");
  } catch (e) {
    alert("MCP JSON 无效: " + e.message);
    return;
  }
  await api("/api/mcp/servers", { method: "PUT", body: JSON.stringify({ mcpServers }) });
  await loadSettings();
};

$("#reloadMcp").onclick = async () => {
  await api("/api/mcp/reload", { method: "POST" });
  await loadSettings();
};

init().catch((e) => { $("#err").textContent = String(e); });
</script>
