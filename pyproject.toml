[project]
name = "velora"
version = "0.1.0"
description = "Personal LLM chat desk with lasting memory (atom-memory)."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    "anyio>=4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    "sse-starlette>=2.1",
    "mcp>=1.8",
    "croniter>=2.0",
    "tzdata>=2024.1",
    "atom-memory @ git+https://github.com/CY202227/atom-memory.git@main",
]

[project.optional-dependencies]
wiki = ["xwiki @ git+https://github.com/CY202227/xWiki.git@main"]
memory = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
velora = "server.terminal:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
