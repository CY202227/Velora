<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Velora agent loop</title>
  <desc id="desc">React Desk sends a turn to FastAPI, which recalls atom-memory, composes a prompt, calls the model and tools, records sources, then persistently writes selected memories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171f35"/><stop offset="1" stop-color="#283963"/></linearGradient>
    <linearGradient id="focus" x1="0" x2="1"><stop stop-color="#697df4"/><stop offset="1" stop-color="#59b9b6"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#aebcf2"/></marker>
  </defs>
  <rect width="1280" height="540" rx="28" fill="url(#bg)"/>
  <text x="64" y="78" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Velora · one turn, made traceable</text>
  <text x="64" y="112" fill="#b8c3e8" font-family="Inter, Arial, sans-serif" font-size="18">Recall only what helps · show why · persist only what lasts</text>
  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="64" y="190" width="190" height="126" rx="18" fill="#f8faff"/>
    <text x="88" y="238" fill="#1a2745" font-size="21" font-weight="700">React Desk</text>
    <text x="88" y="268" fill="#61718b" font-size="15">message · sources</text>
    <text x="88" y="291" fill="#61718b" font-size="15">memory correction</text>
    <rect x="330" y="190" width="220" height="126" rx="18" fill="#f8faff"/>
    <text x="354" y="238" fill="#1a2745" font-size="21" font-weight="700">FastAPI turn chain</text>
    <text x="354" y="268" fill="#61718b" font-size="15">load · recall · compose</text>
    <text x="354" y="291" fill="#61718b" font-size="15">policy gates</text>
    <rect x="626" y="190" width="190" height="126" rx="18" fill="url(#focus)"/>
    <text x="650" y="238" fill="#fff" font-size="21" font-weight="700">Model + tools</text>
    <text x="650" y="268" fill="#eef2ff" font-size="15">stream · tool rounds</text>
    <text x="650" y="291" fill="#eef2ff" font-size="15">response draft</text>
    <rect x="892" y="190" width="324" height="126" rx="18" fill="#f8faff"/>
    <text x="916" y="238" fill="#1a2745" font-size="21" font-weight="700">atom-memory</text>
    <text x="916" y="268" fill="#61718b" font-size="15">layered recall · sources</text>
    <text x="916" y="291" fill="#61718b" font-size="15">consolidation · persona facts</text>
  </g>
  <path d="M254 253 H316" stroke="#aebcf2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M550 253 H612" stroke="#aebcf2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M816 253 H878" stroke="#aebcf2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1054 330 C1054 420 440 436 440 332" fill="none" stroke="#69d0c9" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="590" y="462" text-anchor="middle" fill="#86e0d9" font-family="Inter, Arial, sans-serif" font-size="16">only durable, high-signal turns return to memory</text>
  <text x="64" y="502" fill="#90a0c7" font-family="Inter, Arial, sans-serif" font-size="14">Optional edges: local model sidecar · MCP services · reminders</text>
</svg>
